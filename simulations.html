<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCAAF Simulations</title><style>
:root{--bg:#061126;--p:#0b1b36;--l:#244873;--t:#f5f7ff;--m:#91a6c6;--g:#43df96;--b:#459cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px/1.4 Inter,system-ui}.shell{max-width:1760px;margin:auto;padding:16px}.top,.nav,.hero,.tabs{display:flex;align-items:center}.top{gap:16px;border-bottom:1px solid #19375f;padding-bottom:11px}.brand{font-size:20px;font-weight:950}.nav{gap:5px}.nav a{color:var(--m);padding:8px 11px;text-decoration:none;font-weight:850}.nav .active{background:#173b72;color:white;border-radius:8px}.hero{justify-content:space-between;margin:20px 0 12px}.hero h1{font-size:36px;margin:0}.hero p{color:var(--m);margin:2px 0}.tabs{gap:7px;margin-bottom:10px}.tabs button{border:1px solid var(--l);background:#091a34;color:var(--m);border-radius:999px;padding:8px 14px;font-weight:900}.tabs .active{background:#1857a7;color:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid var(--l);background:var(--p);border-radius:12px;padding:13px}.card h2{margin:0 0 8px}.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;border-top:1px solid #17345c;padding:8px 0;align-items:center}.row:first-of-type{border:0}.team{color:white;text-decoration:none;font-weight:900}.prob{color:var(--g);font-weight:950}.note{color:var(--m)}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style><style id="production-nav-css">
.top .brand a,.top .nav a{color:inherit;text-decoration:none}.top .nav a{color:var(--muted);padding:8px 11px;font-weight:800;white-space:nowrap;border-radius:9px}.top .nav a.active{background:#173b72;color:#fff}.top .model{margin-left:auto}
</style><style id="team-link-css">.teamLink,.team,.match a,.opp{color:inherit!important;text-decoration:none!important}</style></head><body><main class="shell"><div class="top"><div class="brand"><a href="index.html">NCAAF</a></div><div class="nav"><a href="index.html">Dashboard</a><a href="ratings.html">Ratings</a><a href="openers.html">Openers</a><a href="matchups.html">Matchups</a><a href="futures.html">Futures</a><a href="conferences.html">Conferences</a><a href="simulations.html" class="active">Simulations</a><a href="betting.html">Betting</a><a href="v1.html">V1 Reference</a></div></div><section class="hero"><div><h1>Simulation Engine</h1><p>Projected wins, conference outcomes, and the foundation for the playoff model.</p></div></section><div class="tabs"><button class="active" data-mode="conference">Conference races</button><button data-mode="playoff">Playoff model</button></div><div id="content" class="grid"></div></main><script>
let D,mode='conference';const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=(x,d=1)=>Number.isFinite(Number(x))?Number(x).toFixed(d):'—';function render(){if(mode==='playoff'){const top=D.conferences.flatMap(c=>c.teams).sort((a,b)=>b.title_pct-a.title_pct).slice(0,25);content.innerHTML=`<section class="card"><h2>Playoff predictor foundation</h2><p class="note">Current display ranks teams using conference-title simulation probability. The next model layer will add at-large selection, seeding, bracket advancement, and championship probability.</p></section><section class="card"><h2>Leading simulated contenders</h2>${top.map(x=>`<div class="row"><a class="team" href="team.html?team=${e(x.slug)}">${e(x.team)}</a><span>${n(x.projected_wins)} wins</span><span class="prob">${n(x.title_pct*100)}% conf</span></div>`).join('')}</section>`;return}content.innerHTML=D.conferences.map(c=>`<section class="card"><h2><a class="team" href="conferences.html?conference=${encodeURIComponent(c.conference)}">${e(c.conference)}</a></h2><p class="note">Projected title game: ${e(c.championship_game?.projected_matchup?.away_team||'—')} vs ${e(c.championship_game?.projected_matchup?.home_team||'—')}</p>${c.teams.slice(0,5).map(x=>`<div class="row"><a class="team" href="team.html?team=${e(x.slug)}">#${x.projected_finish} ${e(x.team)}</a><span>${n(x.projected_wins)} wins</span><span class="prob">${n(x.title_pct*100)}%</span></div>`).join('')}</section>`).join('')}async function init(){D=await fetch('data/site/conference_workspace.json').then(r=>r.json());render()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});init();
</script></body></html>
