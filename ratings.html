<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCAAF Ratings</title><style>
:root{--bg:#061126;--p:#0b1b36;--l:#244873;--t:#f5f7ff;--m:#91a6c6;--g:#43df96;--a:#ffc45b;--r:#ff7280}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px/1.4 Inter,system-ui}.shell{max-width:1760px;margin:auto;padding:16px}.top,.nav,.hero,.filters{display:flex;align-items:center}.top{gap:16px;border-bottom:1px solid #19375f;padding-bottom:11px}.brand{font-size:20px;font-weight:950}.nav{gap:5px}.nav a{color:var(--m);padding:8px 11px;text-decoration:none;font-weight:850}.nav .active{background:#173b72;color:white;border-radius:8px}.hero{justify-content:space-between;margin:20px 0 12px}.hero h1{font-size:36px;margin:0}.hero p{color:var(--m);margin:2px 0}.stamp{color:#baf8d6;border:1px solid #176747;border-radius:999px;padding:7px 11px}.filters{gap:8px;margin-bottom:10px}.filters input,.filters select{background:#091a34;border:1px solid var(--l);color:white;border-radius:8px;padding:9px}.filters input{min-width:280px}.card{border:1px solid var(--l);border-radius:12px;overflow:hidden}.wrap{max-height:760px;overflow:auto}table{width:100%;border-collapse:collapse}th{position:sticky;top:0;background:#132a50;color:#afbfda;text-align:left;text-transform:uppercase;font-size:9px;padding:9px;cursor:pointer}td{border-top:1px solid #17345c;padding:8px;white-space:nowrap}.team{display:flex;align-items:center;gap:8px;color:white;text-decoration:none;font-weight:900}.team img{width:27px;height:27px;object-fit:contain}.rank{font-weight:950}.good{color:var(--g)}.mid{color:var(--a)}.bad{color:var(--r)}</style><style id="production-nav-css">
.top .brand a,.top .nav a{color:inherit;text-decoration:none}.top .nav a{color:var(--muted);padding:8px 11px;font-weight:800;white-space:nowrap;border-radius:9px}.top .nav a.active{background:#173b72;color:#fff}.top .model{margin-left:auto}
</style><style id="team-link-css">.teamLink,.team,.match a,.opp{color:inherit!important;text-decoration:none!important}</style></head><body><main class="shell"><div class="top"><div class="brand"><a href="index.html">NCAAF</a></div><div class="nav"><a href="ratings.html" class="active">Ratings</a><a href="openers.html">Openers</a><a href="matchups.html">Matchups</a><a href="index.html">Dashboard</a><a href="futures.html">Futures</a><a href="conferences.html">Conferences</a><a href="simulations.html">Simulations</a><a href="betting.html">Betting</a></div></div><section class="hero"><div><h1>Ratings</h1><p>Canonical production composite used by projections across the site.</p></div><div class="stamp" id="stamp">BP 25% · SP+ 25% · FPI 25% · TR 25%</div></section><div class="filters"><input id="search" placeholder="Find a team"><select id="conf"><option value="all">All conferences</option></select></div><div class="card"><div class="wrap"><table><thead><tr><th data-k="overall_rank">Rank</th><th data-k="team">Team</th><th data-k="conference">Conference</th><th data-k="rating">Rating</th><th data-k="offense_rank">Off rank</th><th data-k="defense_rank">Def rank</th><th data-k="conference_rank">Conf rank</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
let teams=[],key='overall_rank',dir=1;const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tone=r=>r<=35?'good':r<=75?'mid':'bad';function render(){const q=search.value.toLowerCase(),a=teams.filter(x=>(conf.value==='all'||x.conference===conf.value)&&x.team.toLowerCase().includes(q)).sort((a,b)=>{const x=a[key],y=b[key];return(typeof x==='string'?x.localeCompare(y):(Number(x??999)-Number(y??999)))*dir});rows.innerHTML=a.map(x=>`<tr><td class="rank ${tone(x.overall_rank)}">#${x.overall_rank}</td><td><a class="team" href="team.html?team=${e(x.logo_slug)}"><img src="logos/${e(x.logo_slug)}.png">${e(x.team)}</a></td><td>${e(x.conference)}</td><td>${Number(x.rating).toFixed(1)}</td><td class="${tone(x.offense_rank)}">#${x.offense_rank}</td><td class="${tone(x.defense_rank)}">#${x.defense_rank}</td><td>#${x.conference_rank}</td></tr>`).join('')}async function init(){const d=await fetch('data/site/matchups_view.json').then(r=>r.json()),m=new Map;d.games.forEach(g=>[g.teams.away,g.teams.home].forEach(t=>m.set(t.team,t)));teams=[...m.values()].filter(t=>t.rating!=null&&t.overall_rank!=null);conf.innerHTML+=[...new Set(teams.map(x=>x.conference).filter(Boolean))].sort().map(x=>`<option>${e(x)}</option>`).join('');stamp.textContent+=` · Updated ${d.production_model.updated}`;render()}document.querySelectorAll('th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;dir=key===k?-dir:1;key=k;render()});[search,conf].forEach(x=>x.oninput=render);init();
</script></body></html>
