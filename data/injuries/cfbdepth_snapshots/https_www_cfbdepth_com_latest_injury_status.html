          // Override adsbygoogle to silently drop all push() calls

        function readIndexedDB(fp, callback) {

            req.onupgradeneeded = function(e) {
              e.target.result.createObjectStore('guest', { keyPath: 'id' });

            req.onsuccess = function(e) {
              var db = e.target.result;
              var tx = db.transaction('guest', 'readonly');
              var get = tx.objectStore('guest').get(key);
              get.onsuccess = function() {
                callback(get.result ? get.result.used : null);
              };
              get.onerror = function() { callback(null); };

            req.onerror = function() { callback(null); };

          // Check fast storage layers first

          _origReplace.apply(history, arguments);
          setTimeout(onRouteChange, 50);

        }
      });
