<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCAAF Conferences</title><style>:root{--bg:#061126;--p:#0b1b36;--l:#244873;--t:#f5f7ff;--m:#91a6c6;--g:#43df96;--r:#ff7280;--b:#459cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px/1.4 Inter,system-ui}.shell{max-width:1760px;margin:auto;padding:16px}.top,.nav,.tabs,.hero,.summary{display:flex;align-items:center}.top{gap:16px;border-bottom:1px solid #19375f;padding-bottom:11px}.brand{font-size:20px;font-weight:950}.nav{gap:5px}.nav a{color:var(--m);padding:8px 11px;text-decoration:none;font-weight:850}.nav .active{background:#173b72;color:white;border-radius:8px}.hero{justify-content:space-between;margin:18px 0 12px}.hero h1{font-size:35px;margin:0}.hero p{color:var(--m);margin:2px 0}.hero select{background:#091a34;border:1px solid var(--l);color:white;padding:9px;border-radius:8px}.summary{gap:8px;margin-bottom:10px}.tile,.card{border:1px solid var(--l);background:var(--p);border-radius:10px}.tile{padding:8px 11px;min-width:150px}.tile span{display:block;color:var(--m);font-size:9px;text-transform:uppercase}.tile b{font-size:18px}.tabs{gap:7px;margin:10px 0}.tabs button{border:1px solid var(--l);background:#091a34;color:var(--m);border-radius:999px;padding:8px 14px;font-weight:900}.tabs .active{background:#1857a7;color:white}.card{overflow:hidden}.wrap{overflow:auto;max-height:690px}table{width:100%;min-width:1450px;border-collapse:collapse}th{position:sticky;top:0;background:#132a50;color:#afbfda;text-align:left;text-transform:uppercase;font-size:9px;padding:9px;z-index:2}td{padding:9px;border-top:1px solid #17345c;white-space:nowrap}.team{display:flex;align-items:center;gap:8px;color:white;font-weight:900;text-decoration:none}.team img{width:27px;height:27px;object-fit:contain}.sub{color:var(--m);font-size:9px}.good{color:var(--g);font-weight:950}.bad{color:var(--r);font-weight:950}.bet{border:1px solid #2b7f5e;color:#baf8d6;border-radius:999px;padding:3px 7px;font-size:9px}.empty{padding:30px;text-align:center;color:var(--m)}</style><style id="production-nav-css">
.top .brand a,.top .nav a{color:inherit;text-decoration:none}.top .nav a{color:var(--muted);padding:8px 11px;font-weight:800;white-space:nowrap;border-radius:9px}.top .nav a.active{background:#173b72;color:#fff}.top .model{margin-left:auto}
</style></head><body><main class="shell"><div class="top"><div class="brand"><a href="index.html">NCAAF</a></div><div class="nav"><a href="legacy.html#rankings">Ratings</a><a href="openers.html">Openers</a><a href="matchups.html">Matchups</a><a href="index.html">Dashboard</a><a href="futures.html">Futures</a><a href="conferences.html" class="active">Conferences</a><a href="legacy.html#simulations">Simulations</a><a href="betting.html">Betting</a></div></div><section class="hero"><div><h1>Conference Workspace</h1><p>Current standings, projected order of finish, schedule strength, markets, and wagers.</p></div><select id="conference"></select></section><div class="summary"><div class="tile"><span>Conference strength</span><b id="strength">—</b></div><div class="tile"><span>Projected title game</span><b id="titleGame">—</b></div><div class="tile"><span>Open wagers</span><b id="bets">—</b></div></div><div class="tabs"><button class="active" data-mode="standings">Standings & projections</button><button data-mode="wins">Win totals</button><button data-mode="title">Conference title</button><button data-mode="movement">Movement & history</button></div><div class="card"><div class="wrap"><table><thead id="head"></thead><tbody id="rows"><tr><td class="empty">Loading conference simulation…</td></tr></tbody></table></div></div></main><script>let D,mode='standings';const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=(x,d=1)=>Number.isFinite(Number(x))?Number(x).toFixed(d):'—',pct=x=>n(Number(x)*100,1)+'%',od=x=>Number.isFinite(Number(x))?(Number(x)>0?'+':'')+Number(x):'—';function cur(){return D.conferences.find(x=>x.conference===conference.value)}function team(x){return`<a class="team" href="legacy.html#team/${e(x.slug)}"><img src="logos/${e(x.slug)}.png"><span>${e(x.team)}<span class="sub">#${x.rank} rating · #${x.projected_finish} projected</span></span></a>`}function render(){const c=cur(),a=c.teams;strength.textContent=n(c.average_strength,1);titleGame.textContent=c.championship_game?.projected_matchup?`${c.championship_game.projected_matchup.away_team} vs ${c.championship_game.projected_matchup.home_team}`:'—';bets.textContent=a.reduce((s,x)=>s+x.open_wagers.length,0);if(mode==='standings'){head.innerHTML='<tr><th>Proj finish</th><th>Team</th><th>Current overall</th><th>Current conf</th><th>Projected overall</th><th>Projected conf</th><th>Overall SOS</th><th>Remaining SOS</th><th>Title game</th><th>Win title</th><th>Wagers</th></tr>';rows.innerHTML=a.map(x=>`<tr><td>#${x.projected_finish}</td><td>${team(x)}</td><td>${x.current_wins}-${x.current_losses}</td><td>${x.current_conf_wins}-${x.current_conf_losses}</td><td>${n(x.projected_wins,1)}</td><td>${n(x.projected_conf_wins,1)}</td><td>${n(x.overall_sos,1)}</td><td>${n(x.remaining_sos,1)}</td><td>${pct(x.make_title_game_pct)}</td><td>${pct(x.title_pct)}</td><td>${x.open_wagers.length?`<span class="bet">BET ${x.open_wagers.length}</span>`:'—'}</td></tr>`).join('')}else if(mode==='wins'){head.innerHTML='<tr><th>Team</th><th>Current record</th><th>Projected wins</th><th>Market total</th><th>Difference</th><th>Remaining SOS</th><th>Wagers</th></tr>';rows.innerHTML=a.map(x=>`<tr><td>${team(x)}</td><td>${x.current_wins}-${x.current_losses}</td><td>${n(x.projected_wins,1)}</td><td>${n(x.market_win_total,1)}</td><td class="${x.win_edge>=0?'good':'bad'}">${x.win_edge>0?'+':''}${n(x.win_edge,1)}</td><td>${n(x.remaining_sos,1)}</td><td>${x.open_wagers.length?`<span class="bet">BET ${x.open_wagers.length}</span>`:'—'}</td></tr>`).join('')}else if(mode==='title'){head.innerHTML='<tr><th>Team</th><th>Current conf</th><th>Projected finish</th><th>Title game %</th><th>Model title %</th><th>Market %</th><th>Difference</th><th>Best odds</th><th>Wagers</th></tr>';rows.innerHTML=a.map(x=>`<tr><td>${team(x)}</td><td>${x.current_conf_wins}-${x.current_conf_losses}</td><td>#${x.projected_finish}</td><td>${pct(x.make_title_game_pct)}</td><td>${pct(x.title_pct)}</td><td>${pct(x.title_market_prob)}</td><td class="${x.title_edge>=0?'good':'bad'}">${n(x.title_edge*100,1)} pts</td><td>${od(x.title_price)}</td><td>${x.open_wagers.length?`<span class="bet">BET ${x.open_wagers.length}</span>`:'—'}</td></tr>`).join('')}else{head.innerHTML='<tr><th>Team</th><th>Projection history</th><th>Market history</th><th>Existing wager EV</th></tr>';rows.innerHTML=a.map(x=>`<tr><td>${team(x)}</td><td class="sub">Simulation snapshots will track projected wins, finish and title probability.</td><td class="sub">Win-total and title-price history will share the same date axis.</td><td>${x.open_wagers.length?`<span class="bet">BET ${x.open_wagers.length}</span>`:'—'}</td></tr>`).join('')}}async function init(){D=await fetch('data/site/conference_workspace.json').then(r=>r.json());conference.innerHTML=D.conferences.map(x=>`<option>${e(x.conference)}</option>`).join('');render()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});conference.oninput=render;init();</script></body></html>
