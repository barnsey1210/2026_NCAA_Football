<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCAAF Futures</title><style>:root{--bg:#061126;--panel:#0b1b36;--line:#244873;--text:#f5f7ff;--muted:#91a6c6;--green:#43df96;--red:#ff7280;--blue:#459cff;--purple:#b69cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui}.shell{max-width:1760px;margin:auto;padding:16px}.top{display:flex;gap:16px;align-items:center;border-bottom:1px solid #19375f;padding-bottom:11px}.brand{font-size:20px;font-weight:950}.nav{display:flex;gap:5px}.nav a{color:var(--muted);padding:8px 11px;text-decoration:none;font-weight:850}.nav .active{background:#173b72;color:white;border-radius:8px}.stamp{margin-left:auto;color:#baf8d6;border:1px solid #176747;border-radius:999px;padding:6px 10px;font-size:10px}.hero{display:flex;justify-content:space-between;align-items:end;margin:18px 0 12px}.hero h1{font-size:35px;margin:0}.hero p{color:var(--muted);margin:2px 0}.summary{display:flex;gap:8px}.tile{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px}.tile span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.tile b{font-size:18px}.tabs,.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tabs button{border:1px solid var(--line);background:#091a34;color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:900}.tabs .active{background:#1857a7;color:white}.filters select,.filters input{background:#091a34;border:1px solid var(--line);color:white;border-radius:7px;padding:8px}.filters input{min-width:230px}.card{border:1px solid var(--line);border-radius:12px;overflow:hidden}.wrap{overflow:auto;max-height:680px}table{width:100%;min-width:1180px;border-collapse:collapse}th{position:sticky;top:0;background:#132a50;color:#afbfda;text-align:left;text-transform:uppercase;font-size:9px;padding:9px;z-index:2}td{padding:9px;border-top:1px solid #17345c;white-space:nowrap}.team{display:flex;align-items:center;gap:8px;font-weight:900}.team img{width:28px;height:28px;object-fit:contain}.sub{color:var(--muted);font-size:9px}.good{color:var(--green);font-weight:950}.bad{color:var(--red);font-weight:950}.book{width:26px;height:20px;object-fit:contain;background:white;border-radius:4px;padding:2px}.bet{border:1px solid #2b7f5e;color:#baf8d6;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:900px){.summary,.stamp{display:none}}</style><style id="production-nav-css">
.top .brand a,.top .nav a{color:inherit;text-decoration:none}.top .nav a{color:var(--muted);padding:8px 11px;font-weight:800;white-space:nowrap;border-radius:9px}.top .nav a.active{background:#173b72;color:#fff}.top .model{margin-left:auto}
</style><style id="team-link-css">.teamLink,.team,.match a,.opp{color:inherit!important;text-decoration:none!important}</style><style>.team{text-decoration:none;color:inherit}</style></head><body><main class="shell"><div class="top"><div class="brand"><a href="index.html">NCAAF</a></div><div class="nav"><a href="index.html">Dashboard</a><a href="ratings.html">Ratings</a><a href="openers.html">Openers</a><a href="matchups.html">Matchups</a><a href="schedule.html">Schedule</a><a href="futures.html" class="active">Futures</a><a href="conferences.html">Conferences</a><a href="playoff.html">Playoff</a><a href="simulations.html">Simulations</a><a href="betting.html">Betting</a><a href="v1.html">V1 Reference</a></div><div class="stamp" id="stamp">Model</div></div><section class="hero"><div><h1>Futures</h1><p>Simulation probability versus executable market price, with live wagers and movement.</p></div><div class="summary"><div class="tile"><span>Teams</span><b id="teams">—</b></div><div class="tile"><span>Markets</span><b id="markets">—</b></div><div class="tile"><span>Open wagers</span><b id="wagers">—</b></div></div></section><div class="tabs"><button class="active" data-mode="wins">Win totals</button><button data-mode="title">Conference titles</button><button data-mode="playoff">Playoffs</button><button data-mode="bets">My open futures</button></div><div class="filters"><select id="conf"><option value="all">All conferences</option></select><input id="search" placeholder="Find a team"><select id="sort"><option value="edge">Largest edge</option><option value="rank">Team rank</option><option value="team">Team name</option></select></div><div class="card"><div class="wrap"><table><thead id="head"></thead><tbody id="rows"><tr><td class="empty">Loading futures…</td></tr></tbody></table></div></div></main><script>let D,mode='wins';const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=(x,d=1)=>Number.isFinite(Number(x))?Number(x).toFixed(d):'—',od=x=>Number.isFinite(Number(x))?(Number(x)>0?'+':'')+Number(x):'—';function logo(x){return`<img src="logos/${e(x.slug)}.png" alt="">`}function book(x){const k=String(x||'').toLowerCase().replace(/[^a-z]/g,''),m={fanduel:'fanduel',draftkings:'draftkings',betmgm:'betmgm',caesars:'caesars'};return m[k]?`<img class="book" src="logos/books/${m[k]}.png" title="${e(x)}">`:e(x||'—')}function render(){let a=D.rows.filter(x=>(conf.value==='all'||x.conference===conf.value)&&x.team.toLowerCase().includes(search.value.toLowerCase())&&(mode!=='bets'||x.open_wagers.length));a.sort((x,y)=>sort.value==='team'?x.team.localeCompare(y.team):sort.value==='rank'?(x.rank||999)-(y.rank||999):Math.abs(mode==='title'?y.title_edge||0:y.win_edge||0)-Math.abs(mode==='title'?x.title_edge||0:x.win_edge||0));head.innerHTML=mode==='title'?'<tr><th>Team</th><th>Model title %</th><th>Market %</th><th>Edge</th><th>Best price</th><th>Book</th><th>Movement</th><th>Wager</th></tr>':'<tr><th>Team</th><th>Projected wins</th><th>Market total</th><th>Edge</th><th>Model side</th><th>Best price</th><th>Book</th><th>Movement</th><th>Wager</th></tr>';rows.innerHTML=a.map(x=>{const t=`<td><a class="team" href="team.html?team=${e(x.slug)}">${logo(x)}<span>${e(x.team)}<span class="sub">#${x.rank} · ${e(x.conference)}</span></span></a></td>`,w=x.open_wagers.length?`<span class="bet">BET ${x.open_wagers.length}</span>`:'—';if(mode==='title')return`<tr>${t}<td>${n(x.title_model_prob*100,1)}%</td><td>${n(x.title_market_prob*100,1)}%</td><td class="${x.title_edge>=0?'good':'bad'}">${n(x.title_edge*100,1)} pts</td><td>${od(x.title_price)}</td><td>${book(x.title_book)}</td><td>${x.title_movement?od(x.title_movement.american_odds_move):'—'}</td><td>${w}</td></tr>`;return`<tr>${t}<td>${n(x.projected_wins,1)}</td><td>${n(x.market_win_total,1)}</td><td class="${x.win_edge>=0?'good':'bad'}">${x.win_edge>0?'+':''}${n(x.win_edge,1)}</td><td>${e(x.win_direction)}</td><td>${od(x.win_price)}</td><td>${book(x.win_book)}</td><td>${x.win_movement?(x.win_movement.win_total_move>0?'+':'')+n(x.win_movement.win_total_move,1):'—'}</td><td>${w}</td></tr>`}).join('')||'<tr><td class="empty">No matching markets.</td></tr>'}async function init(){D=await fetch('data/site/futures_view.json').then(r=>r.json());teams.textContent=D.summary.teams;markets.textContent=D.summary.win_markets+D.summary.title_markets;wagers.textContent=D.summary.open_wagers;stamp.textContent=`Simulation + market · ${String(D.built_at).slice(0,10)}`;const cs=[...new Set(D.rows.map(x=>x.conference).filter(Boolean))].sort();conf.innerHTML+=[...cs].map(x=>`<option>${e(x)}</option>`).join('');render()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});[conf,search,sort].forEach(x=>x.oninput=render);init();</script><script src="playoff_futures_tab.js"></script></body></html>
