<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCAAF Futures</title>
<style>
:root{--bg:#061126;--panel:#0b1b36;--line:#244873;--text:#f5f7ff;--muted:#91a6c6;--green:#43df96;--red:#ff7280;--amber:#ffc45b;--blue:#459cff;--purple:#b69cff;--market:#211735;--marketHead:#56356f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui}.shell{max-width:1760px;margin:auto;padding:16px}.top{display:flex;gap:16px;align-items:center;border-bottom:1px solid #19375f;padding-bottom:11px}.brand{font-size:20px;font-weight:950}.nav{display:flex;gap:5px;overflow:auto}.nav a{color:var(--muted);padding:8px 11px;text-decoration:none;font-weight:850;white-space:nowrap}.nav .active{background:#173b72;color:white;border-radius:8px}.stamp{margin-left:auto;color:#baf8d6;border:1px solid #176747;border-radius:999px;padding:6px 10px;font-size:10px;white-space:nowrap}.hero{display:flex;justify-content:space-between;align-items:end;margin:18px 0 12px}.hero h1{font-size:35px;margin:0}.hero p{color:var(--muted);margin:2px 0}.summary{display:flex;gap:8px}.tile{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px}.tile span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.tile b{font-size:18px}.tabs,.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tabs button{border:1px solid var(--line);background:#091a34;color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:900;cursor:pointer}.tabs .active{background:#1857a7;color:white}.filters select,.filters input{background:#091a34;border:1px solid var(--line);color:white;border-radius:7px;padding:8px}.filters input{min-width:230px}
.marketStatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #28517b;background:#0a213c;border-radius:10px;padding:9px 12px;margin:10px 0;color:#c8d8ed}.marketStatus strong{color:white}.marketStatus.current{border-color:#176747;background:#092438;color:#baf8d6}.marketStatus.stale,.marketStatus.warn{border-color:#8c6726;background:#33270f;color:#ffe0a1}.statusDot{width:8px;height:8px;border-radius:50%;background:var(--green)}.stale .statusDot,.warn .statusDot{background:var(--amber)}.marketStatus .meta{color:var(--muted);font-size:10px}.marketStatus button{margin-left:auto;border:1px solid #42688f;background:#102b50;color:white;border-radius:7px;padding:5px 8px;font-size:10px;cursor:pointer}.qaDetails{display:none;width:100%;border-top:1px solid #31537b;padding-top:7px;margin-top:2px;font-size:10px}.qaDetails.open{display:block}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden}.wrap{overflow:auto;max-height:680px}table{width:100%;min-width:1180px;border-collapse:collapse}th{position:sticky;top:0;background:#132a50;color:#afbfda;text-align:left;text-transform:uppercase;font-size:9px;padding:9px;z-index:2}th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:#fff}th.sortable:after{content:' ↕';opacity:.35}th.sortable.asc:after{content:' ↑';opacity:1}th.sortable.desc:after{content:' ↓';opacity:1}td{padding:8px 9px;border-top:1px solid #17345c;white-space:nowrap}.team{display:flex;align-items:center;gap:8px;font-weight:900}.team img{width:28px;height:28px;object-fit:contain}.sub,.secondary{display:block;color:var(--muted);font-size:9px;font-weight:700}.prob{font-weight:950}.marketCol{background:var(--market)}th.marketCol{background:var(--marketHead);color:#f2dcff}.marketCell{display:flex;align-items:center;gap:7px}.bookLogo{width:24px;height:18px;object-fit:contain;background:white;border-radius:4px;padding:2px}.bookText{font-size:9px;color:#d5c4ee}.good{color:var(--green);font-weight:950}.bad{color:var(--red);font-weight:950}.neutral{color:var(--muted);font-weight:850}.bet{border:1px solid #2b7f5e;color:#baf8d6;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:30px}.sectionHead{background:#0d2443;color:#c9daf0;font-weight:900}.edgeLabel{font-size:9px;color:var(--muted)}@media(max-width:900px){.summary,.stamp{display:none}.shell{padding:10px}}
</style>
<style id="production-nav-css">
.top .brand a,.top .nav a{color:inherit;text-decoration:none}.top .nav a{color:var(--muted);padding:8px 11px;font-weight:800;white-space:nowrap;border-radius:9px}.top .nav a.active{background:#173b72;color:#fff}.top .model{margin-left:auto}
</style><style id="team-link-css">.teamLink,.team,.match a,.opp{color:inherit!important;text-decoration:none!important}</style><style>.team{text-decoration:none;color:inherit}</style></head>
<body>
<main class="shell">
<div class="top"><div class="brand"><a href="index.html">NCAAF</a></div><div class="nav"><a href="index.html">Dashboard</a><a href="ratings.html">Ratings</a><a href="openers.html">Openers</a><a href="matchups.html">Matchups</a><a href="schedule.html">Schedule</a><a href="futures.html" class="active">Futures</a><a href="conferences.html">Conferences</a><a href="playoff.html">Playoff</a><a href="simulations.html">Simulations</a><a href="betting.html">Betting</a><a href="v1.html">V1 Reference</a></div><div class="stamp" id="stamp">Model</div></div>
<section class="hero"><div><h1>Futures</h1><p>Simulation probability versus executable market price, with live wagers and movement.</p></div><div class="summary"><div class="tile"><span>Teams</span><b id="teams">—</b></div><div class="tile"><span>Markets</span><b id="markets">—</b></div><div class="tile"><span>Open wagers</span><b id="wagers">—</b></div></div></section>
<div id="marketStatus" class="marketStatus"><span class="statusDot"></span><strong>Checking futures market freshness…</strong></div>
<div class="tabs"><button class="active" data-mode="wins">Win totals</button><button data-mode="title">Conference titles</button><button data-mode="playoff">Playoffs</button><button data-mode="bets">My open futures</button></div>
<div class="filters"><select id="conf"><option value="all">All conferences</option></select><input id="search" placeholder="Find a team"><select id="sort"><option value="edge">Largest edge</option><option value="rank">Team rank</option><option value="team">Team name</option></select></div>
<div class="card"><div class="wrap"><table><thead id="head"></thead><tbody id="rows"><tr><td class="empty">Loading futures…</td></tr></tbody></table></div></div>
</main>
<script>
let D=null,mode='wins',headerSortKey=null,headerSortDir=1;
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=(x,d=1)=>Number.isFinite(Number(x))?Number(x).toFixed(d):'—';
const od=x=>Number.isFinite(Number(x))?(Number(x)>0?'+':'')+Math.round(Number(x)):'—';
const pct=x=>Number.isFinite(Number(x))?`${(Number(x)*100).toFixed(1)}%`:'—';
const signedPct=x=>Number.isFinite(Number(x))?`${Number(x)>=0?'+':''}${(Number(x)*100).toFixed(1)}%`:'—';
function fairOdds(p){p=Number(p);if(!Number.isFinite(p)||p<=0||p>=1)return p===0?'∞':p===1?'-∞':'—';return p>=.5?Math.round(-100*p/(1-p)):Math.round(100*(1-p)/p)}
function logo(x){const slugMap={'texas-a-m':'texas-aandm'};const slug=slugMap[x.slug]||x.slug;return`<img src="logos/${e(slug)}.png" alt="" onerror="this.style.display='none'">`}
function bookLogo(name){const k=String(name||'').toLowerCase().replace(/[^a-z0-9]/g,''),m={fanduel:'fanduel',draftkings:'draftkings',betmgm:'betmgm',caesars:'caesars'};return m[k]?`<img class="bookLogo" src="logos/books/${m[k]}.png" title="${e(name)}" alt="${e(name)}">`:`<span class="bookText">${e(name||'—')}</span>`}
function modelProbCell(p){return`<span class="prob">${pct(p)}</span><span class="secondary">${od(fairOdds(p))} fair</span>`}
function marketProbCell(p,price,book){return`<span class="marketCell"><span><span class="prob">${pct(p)}</span><span class="secondary">${od(price)} market</span></span>${bookLogo(book)}</span>`}
function edgeCell(v){return`<span class="${v==null?'neutral':v>=0?'good':'bad'}">${signedPct(v)}</span>`}
function teamCell(x){return`<td><span class="team">${logo(x)}<span>${e(x.team)}<span class="sub">#${x.rank??'—'} · ${e(x.conference)}</span></span></span></td>`}
function wagerCell(x){return x.open_wagers.length?`<span class="bet">BET ${x.open_wagers.length}</span>`:'—'}

function header(label,key,extra=''){const active=headerSortKey===key?` ${headerSortDir>0?'asc':'desc'}`:'';return `<th class="sortable${active}${extra?' '+extra:''}" data-hsort="${key}">${label}</th>`}
function valueForSort(x,key){
 const map={
  team:x.team,rank:x.rank,projected_wins:x.projected_wins,market_win_total:x.market_win_total,
  win_edge:x.win_edge,win_direction:x.win_direction,win_price:x.win_price,
  win_movement:x.win_movement?.win_total_move,title_movement:x.title_movement?.american_odds_move,
  title_model_prob:x.title_model_prob,title_market_prob:x.title_market_prob,title_edge:x.title_edge,
  playoff_model_prob:x.playoff_model_prob,playoff_market_prob:x.playoff_market_prob,playoff_edge:x.playoff_edge,
  quarterfinal_model_prob:x.quarterfinal_model_prob,semifinal_model_prob:x.semifinal_model_prob,
  national_title_game_model_prob:x.national_title_game_model_prob,national_title_model_prob:x.national_title_model_prob,
  national_title_market_prob:x.national_title_market_prob,national_title_edge:x.national_title_edge,
  wagers:x.open_wagers?.length||0
 };
 return map[key];
}
function bindHeaderSort(){
 document.querySelectorAll('[data-hsort]').forEach(th=>th.onclick=()=>{
  const key=th.dataset.hsort;
  if(headerSortKey===key)headerSortDir*=-1;else{headerSortKey=key;headerSortDir=1}
  render();
 });
}
function edgeFor(x){if(mode==='title')return x.title_edge;if(mode==='playoff')return Math.max(Math.abs(x.playoff_edge??0),Math.abs(x.national_title_edge??0));if(mode==='bets')return Math.max(Math.abs(x.win_edge??0),Math.abs(x.title_edge??0),Math.abs(x.playoff_edge??0),Math.abs(x.national_title_edge??0));return x.win_edge}
function filtered(){const q=search.value.toLowerCase(),g6=new Set(['American','CUSA','MAC','MW','PAC12','Sun Belt']);return D.rows.filter(x=>(conf.value==='all'||(conf.value==='g6'&&g6.has(x.conference))||x.conference===conf.value)&&x.team.toLowerCase().includes(q)&&(mode!=='bets'||x.open_wagers.length))}
function sortedRows(){
 const a=filtered();
 if(headerSortKey){
  a.sort((x,y)=>{
   const xv=valueForSort(x,headerSortKey),yv=valueForSort(y,headerSortKey);
   if(xv==null&&yv==null)return 0;if(xv==null)return 1;if(yv==null)return -1;
   const result=typeof xv==='string'?String(xv).localeCompare(String(yv)):Number(xv)-Number(yv);
   return result*headerSortDir;
  });
 }else{
  a.sort((x,y)=>sort.value==='team'?x.team.localeCompare(y.team):sort.value==='rank'?(x.rank??999)-(y.rank??999):Math.abs(edgeFor(y)??0)-Math.abs(edgeFor(x)??0));
 }
 return a;
}
function renderWins(a){
 head.innerHTML=`<tr>${header('Team','team')}${header('Projected wins','projected_wins')}${header('Market total','market_win_total','marketCol')}${header('Win edge','win_edge')}${header('Model side','win_direction')}${header('Best market','win_price','marketCol')}${header('Movement','win_movement')}${header('Wager','wagers')}</tr>`;
 rows.innerHTML=a.map(x=>`<tr>${teamCell(x)}<td>${n(x.projected_wins,1)}</td><td class="marketCol">${n(x.market_win_total,1)}</td><td class="${x.win_edge==null?'neutral':x.win_edge>=0?'good':'bad'}">${x.win_edge>0?'+':''}${n(x.win_edge,1)}</td><td>${e(x.win_direction)}</td><td class="marketCol"><span class="marketCell"><span><b>${od(x.win_price)}</b><span class="secondary">${e(x.win_book||'—')}</span></span>${bookLogo(x.win_book)}</span></td><td>${x.win_movement?(x.win_movement.win_total_move>0?'+':'')+n(x.win_movement.win_total_move,1):'—'}</td><td>${wagerCell(x)}</td></tr>`).join('');
}
function renderTitle(a){
 head.innerHTML=`<tr>${header('Team','team')}${header('Model title','title_model_prob')}${header('Title market','title_market_prob','marketCol')}${header('Title edge','title_edge')}${header('Movement','title_movement')}${header('Wager','wagers')}</tr>`;
 rows.innerHTML=a.map(x=>`<tr>${teamCell(x)}<td>${modelProbCell(x.title_model_prob)}</td><td class="marketCol">${marketProbCell(x.title_market_prob,x.title_price,x.title_book)}</td><td>${edgeCell(x.title_edge)}</td><td>${x.title_movement?od(x.title_movement.american_odds_move):'—'}</td><td>${wagerCell(x)}</td></tr>`).join('');
}
function renderPlayoff(a){
 head.innerHTML=`<tr>${header('Team','team')}${header('Make CFP','playoff_model_prob')}${header('Make CFP market','playoff_market_prob','marketCol')}${header('Make CFP edge','playoff_edge')}${header('Quarterfinal','quarterfinal_model_prob')}${header('Semifinal','semifinal_model_prob')}${header('Title game','national_title_game_model_prob')}${header('Win title','national_title_model_prob')}${header('Title market','national_title_market_prob','marketCol')}${header('Title edge','national_title_edge')}${header('Wager','wagers')}</tr>`;
 rows.innerHTML=a.map(x=>`<tr>${teamCell(x)}<td>${modelProbCell(x.playoff_model_prob)}</td><td class="marketCol">${marketProbCell(x.playoff_market_prob,x.playoff_price,x.playoff_book)}</td><td>${edgeCell(x.playoff_edge)}</td><td>${modelProbCell(x.quarterfinal_model_prob)}</td><td>${modelProbCell(x.semifinal_model_prob)}</td><td>${modelProbCell(x.national_title_game_model_prob)}</td><td>${modelProbCell(x.national_title_model_prob)}</td><td class="marketCol">${marketProbCell(x.national_title_market_prob,x.national_title_price,x.national_title_book)}</td><td>${edgeCell(x.national_title_edge)}</td><td>${wagerCell(x)}</td></tr>`).join('');
}
function renderBets(a){
 head.innerHTML=`<tr>${header('Team','team')}${header('Open wagers','wagers')}${header('Win edge','win_edge')}${header('Conference title edge','title_edge')}${header('Make CFP edge','playoff_edge')}${header('National title edge','national_title_edge')}</tr>`;
 rows.innerHTML=a.map(x=>`<tr>${teamCell(x)}<td>${x.open_wagers.map(w=>`<span class="bet">${e(w.selection||w.market)} ${od(w.price)}</span>`).join(' ')}</td><td>${x.win_edge==null?'—':`${x.win_edge>0?'+':''}${n(x.win_edge,1)}`}</td><td>${edgeCell(x.title_edge)}</td><td>${edgeCell(x.playoff_edge)}</td><td>${edgeCell(x.national_title_edge)}</td></tr>`).join('');
}
function render(){
 if(!D)return;
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
 const a=sortedRows();
 if(mode==='title')renderTitle(a);else if(mode==='playoff')renderPlayoff(a);else if(mode==='bets')renderBets(a);else renderWins(a);
 if(!a.length)rows.innerHTML='<tr><td colspan="12" class="empty">No matching markets.</td></tr>';bindHeaderSort();
}
function fmtTime(v){if(!v)return'Unavailable';const d=new Date(v);return d.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'})}
function renderFreshness(){
 const f=D.market_freshness?.playoff_futures||{},qa=D.market_qa||{},box=document.getElementById('marketStatus'),books=(f.books||[]).join(' · ')||'No books reported';
 const cls=f.status==='current'&&qa.status==='pass'?'current':f.status==='current'?'warn':'stale';
 box.className=`marketStatus ${cls}`;
 box.innerHTML=`<span class="statusDot"></span><strong>${f.source||'Futures market'}: ${f.status||'unavailable'}</strong><span>Last pull ${fmtTime(f.pulled_at)}</span><span class="meta">Books: ${e(books)}</span><button id="qaToggle">QA ${String(qa.status||'unknown').toUpperCase()}</button><div class="qaDetails" id="qaDetails">Coverage — Make CFP: ${qa.coverage?.make_cfp??'—'} · National title: ${qa.coverage?.national_title??'—'} · Invalid prices: ${qa.invalid_prices??'—'} · Duplicates: ${qa.duplicate_offers??'—'}${qa.warnings?.length?`<br>Warnings: ${qa.warnings.map(e).join(' · ')}`:'<br>No QA warnings.'}</div>`;
 document.getElementById('qaToggle').onclick=()=>document.getElementById('qaDetails').classList.toggle('open');
}
async function init(){
 D=await fetch(`data/site/futures_view.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()});
 teams.textContent=D.summary.teams;
 markets.textContent=(D.summary.win_markets||0)+(D.summary.title_markets||0)+(D.summary.playoff_markets||0)+(D.summary.national_title_markets||0);
 wagers.textContent=D.summary.open_wagers;
 stamp.textContent=`Simulation + market · ${String(D.built_at).slice(0,10)}`;
 const cs=[...new Set(D.rows.map(x=>x.conference).filter(Boolean))].sort();
 conf.innerHTML='<option value="all">All conferences</option><option value="g6">G6</option>'+cs.map(x=>`<option>${e(x)}</option>`).join('');
 renderFreshness();
 render();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});
[conf,search].forEach(x=>x.addEventListener('input',render));sort.addEventListener('input',()=>{headerSortKey=null;headerSortDir=1;render()});
init().catch(err=>rows.innerHTML=`<tr><td class="empty">Unable to load futures data: ${e(err.message)}</td></tr>`);
</script>
</body>
</html>
