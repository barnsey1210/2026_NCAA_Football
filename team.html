<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCAAF Team</title><style>
:root{--bg:#061126;--p:#0b1b36;--p2:#081932;--l:#244873;--t:#f5f7ff;--m:#91a6c6;--g:#43df96;--a:#ffc45b;--r:#ff7280}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px/1.4 Inter,system-ui}.shell{max-width:1760px;margin:auto;padding:16px}.top,.nav,.hero,.stats{display:flex;align-items:center}.top{gap:16px;border-bottom:1px solid #19375f;padding-bottom:11px}.brand{font-size:20px;font-weight:950}.nav{gap:5px}.nav a{color:var(--m);padding:8px 11px;text-decoration:none;font-weight:850}.hero{gap:18px;margin:22px 0}.hero img{width:105px;height:105px;object-fit:contain}.hero h1{font-size:40px;margin:0}.hero p{color:var(--m);margin:3px 0}.stats{gap:7px;flex-wrap:wrap}.stat,.card{border:1px solid var(--l);background:var(--p);border-radius:11px}.stat{padding:8px 11px;min-width:130px}.stat span{display:block;color:var(--m);font-size:9px;text-transform:uppercase}.stat b{font-size:19px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.card{padding:13px;margin-bottom:10px}.card h2{margin:0 0 9px;font-size:18px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini div{background:var(--p2);border-radius:8px;padding:9px}.mini span{display:block;color:var(--m);font-size:9px;text-transform:uppercase}table{width:100%;border-collapse:collapse}th{background:var(--p2);color:var(--m);text-align:left;text-transform:uppercase;font-size:9px;padding:7px}td{padding:8px 7px;border-top:1px solid #17345c;white-space:nowrap}.opp{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:850}.opp img{width:23px;height:23px;object-fit:contain}.good{color:var(--g)}.mid{color:var(--a)}.bad{color:var(--r)}.empty{padding:30px;color:var(--m)}@media(max-width:900px){.grid{grid-template-columns:1fr}.nav{overflow:auto}.hero h1{font-size:30px}}
</style><style id="production-nav-css">
.top .brand a,.top .nav a{color:inherit;text-decoration:none}.top .nav a{color:var(--muted);padding:8px 11px;font-weight:800;white-space:nowrap;border-radius:9px}.top .nav a.active{background:#173b72;color:#fff}.top .model{margin-left:auto}
</style></head><body><main class="shell"><div class="top"><div class="brand"><a href="index.html">NCAAF</a></div><div class="nav"><a href="legacy.html#rankings">Ratings</a><a href="openers.html">Openers</a><a href="matchups.html">Matchups</a><a href="index.html">Dashboard</a><a href="futures.html">Futures</a><a href="conferences.html">Conferences</a><a href="legacy.html#simulations">Simulations</a><a href="betting.html">Betting</a></div></div><section id="app"><div class="empty">Loading team workspace…</div></section></main><script>
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=(x,d=1)=>Number.isFinite(Number(x))?Number(x).toFixed(d):'—',ln=x=>Number.isFinite(Number(x))?(Number(x)>0?'+':'')+Number(x).toFixed(1):'—';function tone(r){return r==null?'':r<=35?'good':r<=75?'mid':'bad'}function slug(x){return String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function teamLink(t,s){return`<a class="opp" href="team.html?team=${encodeURIComponent(s||slug(t))}"><img src="logos/${e(s||slug(t))}.png" onerror="this.style.display='none'">${e(t)}</a>`}function gameRow(g,team){const home=g.game.home_team===team,opp=home?g.game.away_team:g.game.home_team,ot=home?g.teams.away:g.teams.home,market=g.market.spread.home_line,model=g.model.home_spread;return`<tr><td>W${g.game.week}</td><td>${String(g.game.date||'').slice(5,10)}</td><td>${home?'vs':'at'} ${teamLink(opp,ot.logo_slug)}</td><td class="${tone(ot.overall_rank)}">#${ot.overall_rank??'—'}</td><td>${model==null?'—':ln(home?model:-model)}</td><td>${market==null?'—':ln(home?market:-market)}</td><td><a href="matchups.html?game_id=${e(g.game.game_id)}">Matchup</a></td></tr>`}async function init(){const [m,f,c]=await Promise.all([fetch('data/site/matchups_view.json').then(r=>r.json()),fetch('data/site/futures_view.json').then(r=>r.json()),fetch('data/site/conference_workspace.json').then(r=>r.json())]),q=decodeURIComponent(new URLSearchParams(location.search).get('team')||'').toLowerCase(),games=m.games.filter(g=>[g.teams.away,g.teams.home].some(t=>t.team.toLowerCase()===q||t.logo_slug===q||slug(t.team)===q));if(!games.length)throw Error('Team not found');const meta=[games[0].teams.away,games[0].teams.home].find(t=>t.team.toLowerCase()===q||t.logo_slug===q||slug(t.team)===q),team=meta.team,fu=f.rows.find(x=>x.team===team)||{},cw=c.conferences.flatMap(x=>x.teams).find(x=>x.team===team)||{},rp=meta.returning_production||{};document.title=`${team} — NCAAF`;app.innerHTML=`<section class="hero"><img src="logos/${e(meta.logo_slug)}.png"><div><h1>${e(team)}</h1><p>${e(meta.conference||'')} · redesigned team workspace</p><div class="stats"><div class="stat"><span>Overall rank</span><b class="${tone(meta.overall_rank)}">#${meta.overall_rank??'—'}</b></div><div class="stat"><span>Conference rank</span><b>#${meta.conference_rank??'—'}</b></div><div class="stat"><span>2026 record</span><b>${meta.record?`${meta.record.wins}-${meta.record.losses}`:'0-0'}</b></div><div class="stat"><span>Projected wins</span><b>${n(cw.projected_wins??fu.projected_wins)}</b></div><div class="stat"><span>Conference title</span><b>${n((cw.title_pct??fu.title_model_prob)*100,1)}%</b></div></div></div></section><div class="grid"><div><section class="card"><h2>2026 schedule and matchup links</h2><div style="overflow:auto"><table><thead><tr><th>Week</th><th>Date</th><th>Opponent</th><th>Opp rank</th><th>Model</th><th>Market</th><th></th></tr></thead><tbody>${games.sort((a,b)=>String(a.game.date).localeCompare(String(b.game.date))).map(g=>gameRow(g,team)).join('')}</tbody></table></div></section></div><div><section class="card"><h2>Team profile</h2><div class="mini"><div><span>Power rating</span><b>${n(meta.rating)}</b></div><div><span>Offense rank</span><b class="${tone(meta.offense_rank)}">#${meta.offense_rank??'—'}</b></div><div><span>Defense rank</span><b class="${tone(meta.defense_rank)}">#${meta.defense_rank??'—'}</b></div></div></section><section class="card"><h2>Returning production</h2><div class="mini"><div><span>Overall</span><b class="${tone(rp.overall_rank)}">#${rp.overall_rank??'—'}</b></div><div><span>Offense</span><b class="${tone(rp.offense_rank)}">#${rp.offense_rank??'—'}</b></div><div><span>Defense</span><b class="${tone(rp.defense_rank)}">#${rp.defense_rank??'—'}</b></div></div></section><section class="card"><h2>Futures market</h2><div class="mini"><div><span>Win total</span><b>${n(fu.market_win_total)}</b></div><div><span>Model edge</span><b>${n(fu.win_edge)}</b></div><div><span>Title edge</span><b>${n((fu.title_edge||0)*100)} pts</b></div></div></section></div></div>`}init().catch(err=>app.innerHTML=`<div class="empty">Unable to load team: ${e(err.message)}</div>`);
</script></body></html>
