let GC=new Map,FILTER='all';const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),has=x=>x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(x)),n=(x,d=1)=>has(x)?Number(x).toFixed(d):'—',pct=x=>has(x)?`${(100*Number(x)).toFixed(1)}%`:'—',ln=x=>has(x)?(Number(x)>0?'+':'')+Number(x).toFixed(1):'—',od=x=>has(x)?(Number(x)>0?'+':'')+Number(x):'—';function tone(r){return r==null?'':r<=35?'good':r<=75?'mid':'bad'}function edgeTone(v){return !Number.isFinite(v)?'':v>=3?'good':v>=1?'mid':v<=-3?'bad':''}function slug(x){return String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function teamLink(t,s){return`<a class="opp" href="team.html?team=${encodeURIComponent(s||slug(t))}"><img src="logos/${e(s||slug(t))}.png" onerror="this.style.display='none'">${e(t)}</a>`}function value(x,suffix=''){return has(x)?`${n(x)}${suffix}`:'<span class="dash">—</span>'}function rankValue(x){return x==null?'<span class="dash">—</span>':`<span class="${tone(x)}">#${x}</span>`}
function teamGame(g,team){const home=g.game.home_team===team,opp=home?g.game.away_team:g.game.home_team,tm=home?g.teams.home:g.teams.away,ot=home?g.teams.away:g.teams.home,model=g.model.home_spread,rawMarket=g.market.spread.home_line,market=has(rawMarket)&&(Number(rawMarket)!==0||g.market.spread.book)?Number(rawMarket):null,rawTotal=g.market.total.line,marketTotal=has(rawTotal)&&(Number(rawTotal)!==0||g.market.total.book)?Number(rawTotal):null,teamModel=model==null?null:(home?model:-model),teamMarket=market==null?null:(home?market:-market),wp=g.model.home_win_probability==null?null:(home?g.model.home_win_probability:1-g.model.home_win_probability),offEdge=tm.offense_rank!=null&&ot.defense_rank!=null?ot.defense_rank-tm.offense_rank:null,defEdge=tm.defense_rank!=null&&ot.offense_rank!=null?ot.offense_rank-tm.defense_rank:null,betEdge=teamModel!=null&&teamMarket!=null?teamMarket-teamModel:null,gc=GC.get(`${g.game.game_id}|${team}`),score=g.game.completed&&g.game.away_score!=null&&g.game.home_score!=null?`${g.game.away_score}-${g.game.home_score}`:'—';return{g,home,opp,tm,ot,teamModel,teamMarket,marketTotal,wp,offEdge,defEdge,betEdge,gc,score}}
function resultText(x){if(!x.g.game.completed||x.g.game.away_score==null)return'—';const teamScore=x.home?x.g.game.home_score:x.g.game.away_score,oppScore=x.home?x.g.game.away_score:x.g.game.home_score;return`${teamScore>oppScore?'W':teamScore<oppScore?'L':'T'} ${x.score}`}
function rankBand(r){return r==null?'rk0':r<=10?'rk1':r<=25?'rk2':r<=50?'rk3':r<=80?'rk4':r<=110?'rk5':'rk6'}function wpBand(p){return p==null?'rk0':p>=.75?'wp5':p>=.6?'wp4':p>=.4?'wp3':p>=.25?'wp2':'wp1'}function spreadBand(s){return s==null?'rk0':s<=-9?'sp5':s<=-.5?'sp4':s<.5?'sp3':s<=8.5?'sp2':'sp1'}function resultBand(x){const v=resultText(x);return v.startsWith('W')?'resultWin':v.startsWith('L')?'resultLoss':'rk0'}
function deltaData(pre,cur,type='number'){if(pre==null||cur==null||!Number.isFinite(Number(pre))||!Number.isFinite(Number(cur)))return{text:'—',cls:'deltaFlat'};const p=Number(pre),c=Number(cur),raw=type==='rank'?p-c:c-p,d=Math.abs(raw)<.05?0:raw,shown=type==='percent'?`${d>0?'+':''}${(d*100).toFixed(1)} pts`:type==='rank'?`${d>0?'↑ ':d<0?'↓ ':''}${Math.abs(d)}`:`${d>0?'+':''}${d.toFixed(1)}`;return{text:shown,cls:d>0?'deltaUp':d<0?'deltaDown':'deltaFlat'}}

function configureComparison(meta,rt,pt,cw,fu){const comparison=document.querySelector('.comparison');if(!comparison)return;const preTitle=pt.conference_title_pct==null?null:(Number(pt.conference_title_pct)>1?Number(pt.conference_title_pct)/100:Number(pt.conference_title_pct));comparison.className='comparisonTable';comparison.innerHTML=`<table><thead><tr><th>Metric</th><th>Preseason</th><th>Current</th><th>Delta</th></tr></thead><tbody>${compRow('Power rating',rt.preseason_rating,rt.rating)}${compRow('National rank',rt.preseason_rank,meta.overall_rank,'rank')}${compRow('Projected wins',pt.avg_total_wins??pt.projected_wins,cw.projected_wins??fu.projected_wins)}${compRow('Projected conf wins',pt.avg_conference_wins,cw.projected_conf_wins)}${compRow('Conference title',preTitle,cw.title_pct??fu.title_model_prob,'percent')}</tbody></table>`}

e==null?'No market':'Edge '+n(100*fu.playoff_edge)+' pts'}</small></div><div class="metric"><span>National title</span><b>${pct(fu.national_title_model_prob)} vs ${pct(fu.national_title_market_prob)}</b><small>${fu.national_title_edge==null?'—':`${n(100*fu.national_title_edge)} pts · ${od(fu.national_title_price)}`}</small></div></div></section></div><div><section class="card"><h2>Ratings</h2><div class="mini"><div class="metric"><span>Composite</span><b>${value(rt.rating)}</b><small class="${rankBand(meta.overall_rank)}">${meta.overall_rank==null?'—':'#'+meta.overall_rank}</small></div>${sourceMetric('SP+',rt.sources?.spplus)}${sourceMetric('FPI',rt.sources?.fpi)}${sourceMetric('TeamRankings',rt.sources?.teamrankings)}${sourceMetric('Brad Powers',rt.sources?.bradpowers)}<div class="metric"><span>Variance</span><b>${value(rt.variance)}</b></div></div></section><section class="card"><h2>Win Distribution</h2><p class="sectionNote">Frozen preseason simulation; current in-season distribution is not exposed by V2 JSON.</p>${winBars(pt.win_distribution)}</section></div><section class="card schedule"><h2>KFord-inspired Schedule Command Center</h2><p class="sectionNote">Offense edge = opponent defense rank minus ${e(team)} offense rank. Defense edge = opponent offense rank minus ${e(team)} defense rank. Positive values favor ${e(team)}.</p><div class="filters" id="filters"><button class="active" data-filter="all">All Games</button><button data-filter="fbs">FBS vs FBS</button><button data-filter="conference">Conference Only</button></div><div class="tableWrap"><table><thead><tr><th>Wk</th><th>Date</th><th>Opponent</th><th>Opp rank</th><th>Off edge</th><th>Def edge</th><th>Win %</th><th>Model spread</th><th>Market spread</th><th>Betting edge</th><th>Proj total</th><th>Market total</th><th>WS</th><th>Result</th></tr></thead><tbody id="scheduleRows"></tbody></table></div></section><section class="card schedule"><h2>Conference Outlook</h2><div class="outlook"><div class="metric" <style>
img.v2-dark-logo-badge{
  box-sizing:border-box !important;
  background:rgba(255,255,255,.96) !important;
  border:1px solid rgba(255,255,255,.30) !important;
  border-radius:8px !important;
  padding:3px !important;
  box-shadow:0 2px 7px rgba(0,0,0,.22) !important;
}
img.v2-dark-logo-badge.v2-dark-logo-small{
  border-radius:6px !important;
  padding:2px !important;
}
img.v2-dark-logo-badge.v2-dark-logo-large{
  border-radius:11px !important;
  padding:5px !important;
}
</style>
<script>
(function(){
  'use strict';
  const DARK_LOGO_KEYS=new Set([
    'air-force','boise-state','byu','duke','georgia-tech','iowa','navy',
    'north-carolina','north-dakota-state','notre-dame','penn-state',
    'pittsburgh','rice','toledo','tulane','utep','virginia',
    'wake-forest','west-virginia'
  ]);
  const DARK_TEAM_NAMES=[
    'air force','boise state','byu','duke','georgia tech','iowa','navy',
    'north carolina','north dakota state','notre dame','penn state',
    'pittsburgh','rice','toledo','tulane','utep','virginia',
    'wake forest','west virginia'
  ];
  function normalize(value){
    return String(value||'').toLowerCase()
      .replace(/\.(png|webp|jpe?g|svg)(?:[?#].*)?$/,'')
      .replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-')
      .replace(/^-+|-+$/g,'');
  }
  function logoKey(img){
    const src=img.getAttribute('src')||'';
    if(!/(^|\/)logos\//i.test(src) || /\/logos\/books\//i.test(src)) return '';
    return normalize(src.split('/').pop()||'');
  }
  function nearbyText(img){
    const host=img.closest('.team,.matchup,.mwTeam,.teamSummary,.team-card,.teamCard,.rating-row,.ratings-row,tr,td,a,span,div');
    return String(img.getAttribute('alt')||img.getAttribute('title')||host?.textContent||'').toLowerCase();
  }
  function isDarkTeamLogo(img){
    const key=logoKey(img);
    if(!key) return false;
    if(DARK_LOGO_KEYS.has(key)) return true;
    const text=nearbyText(img);
    return DARK_TEAM_NAMES.some(name=>{
      const pattern=new RegExp('(^|[^a-z])'+name.replace(/\s+/g,'\\s+')+'([^a-z]|$)','i');
      return pattern.test(text);
    });
  }
  function classifySize(img){
    const rect=img.getBoundingClientRect();
    const size=Math.max(rect.width||0,rect.height||0);
    img.classList.toggle('v2-dark-logo-small',size>0&&size<=24);
    img.classList.toggle('v2-dark-logo-large',size>=48);
  }
  function decorate(root=document){
    const imgs=[];
    if(root instanceof HTMLImageElement) imgs.push(root);
    if(root.querySelectorAll) imgs.push(...root.querySelectorAll('img'));
    for(const img of imgs){
      if(isDarkTeamLogo(img)){
        img.classList.add('v2-dark-logo-badge');
        if(img.complete) classifySize(img);
        else img.addEventListener('load',()=>classifySize(img),{once:true});
      }else{
        img.classList.remove('v2-dark-logo-badge','v2-dark-logo-small','v2-dark-logo-large');
      }
    }
  }
  let queued=false;
  function queue(root=document){
    if(queued)return;
    queued=true;
    requestAnimationFrame(()=>{queued=false;decorate(root)});
  }
  document.addEventListener('DOMContentLoaded',()=>queue(document));
  window.addEventListener('load',()=>queue(document));
  new MutationObserver(mutations=>{
    for(const mutation of mutations){
      for(const node of mutation.addedNodes){if(node.nodeType===1)queue(node)}
      if(mutation.type==='attributes'&&mutation.target instanceof HTMLImageElement)queue(mutation.target);
    }
  }).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src','alt','title']});
  setTimeout(()=>queue(document),250);
  setTimeout(()=>queue(document),1000);
})();
</script>
