<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCAAF Team</title><style>
:root{--bg:#061126;--p:#0b1b36;--p2:#081932;--p3:#10284a;--l:#244873;--t:#f5f7ff;--m:#91a6c6;--g:#43df96;--a:#ffc45b;--r:#ff7280;--b:#55a2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px/1.4 Inter,system-ui}.shell{max-width:1900px;margin:auto;padding:16px}.top,.nav,.hero,.stats,.filters{display:flex;align-items:center}.top{gap:16px;border-bottom:1px solid #19375f;padding-bottom:11px}.brand{font-size:20px;font-weight:950}.nav{gap:5px;overflow:auto}.nav a{color:var(--m);padding:8px 11px;text-decoration:none;font-weight:850;white-space:nowrap}.hero{gap:18px;margin:18px 0}.hero>img{width:100px;height:100px;object-fit:contain}.hero h1{font-size:40px;margin:0}.hero p,.muted{color:var(--m)}.hero p{margin:3px 0}.stats{gap:7px;flex-wrap:wrap}.stat,.card{border:1px solid var(--l);background:var(--p);border-radius:12px}.stat{padding:8px 11px;min-width:128px}.stat span,.metric span{display:block;color:var(--m);font-size:9px;text-transform:uppercase;font-weight:800}.stat b{font-size:19px}.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px;margin-bottom:10px;min-width:0}.card h2{margin:0 0 10px;font-size:18px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{background:var(--p2);border-radius:8px;padding:9px;min-width:0}.metric b{font-size:16px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:7px}.comparison .metric{display:grid;grid-template-columns:1fr auto auto;gap:8px}.comparison strong{color:var(--m);font-size:9px;text-transform:uppercase}.bars{display:grid;gap:5px}.bar{display:grid;grid-template-columns:28px 1fr 46px;gap:7px;align-items:center}.track{height:10px;background:#041020;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--b)}.filters{gap:7px;flex-wrap:wrap;margin-bottom:10px}.filters button{border:1px solid var(--l);background:#091a34;color:var(--m);border-radius:999px;padding:7px 12px;font-weight:900;cursor:pointer}.filters button.active{background:#1857a7;border-color:#55a2ff;color:#fff}.schedule{grid-column:1/-1}.tableWrap{overflow:auto;max-height:650px}table{width:100%;border-collapse:collapse}th{position:sticky;top:0;z-index:2;background:var(--p3);color:var(--m);text-align:left;text-transform:uppercase;font-size:9px;padding:8px;white-space:nowrap}td{padding:8px;border-top:1px solid #17345c;white-space:nowrap}.gameRow{cursor:pointer}.gameRow:hover{background:#0d2445}.gameRow.open{background:#102b51}.opp{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:850}.opp img,.tinyLogo{width:23px;height:23px;object-fit:contain}.good{color:var(--g)}.mid{color:var(--a)}.bad{color:var(--r)}.detail td{white-space:normal;background:#07172e;padding:12px}.detailGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.detailBox{background:var(--p2);border:1px solid #17345c;border-radius:8px;padding:9px}.detailBox h3{margin:0 0 6px;font-size:12px}.detailBox ul{margin:0;padding-left:17px}.empty{padding:30px;color:var(--m)}.marketRows{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.outlook{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.sectionNote{font-size:10px;color:var(--m);margin-top:-6px;margin-bottom:9px}.dash{color:var(--m)}@media(max-width:1100px){.dashboard{grid-template-columns:1fr}.schedule{grid-column:auto}.detailGrid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.hero h1{font-size:30px}.comparison,.marketRows,.outlook,.detailGrid{grid-template-columns:1fr}.nav{overflow:auto}}
</style><style id="production-nav-css">
.top .brand a,.top .nav a{color:inherit;text-decoration:none}.top .nav a{color:var(--muted);padding:8px 11px;font-weight:800;white-space:nowrap;border-radius:9px}.top .nav a.active{background:#173b72;color:#fff}.top .model{margin-left:auto}
</style><style id="team-link-css">.teamLink,.team,.match a,.opp{color:inherit!important;text-decoration:none!important}</style><style>.v1TeamLink{margin:12px 0}.v1TeamLink a{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:7px 11px;color:#fff;text-decoration:none;font-weight:900}</style></head><body><main class="shell"><div class="top"><div class="brand"><a href="index.html">NCAAF</a></div><div class="nav"><a href="index.html">Dashboard</a><a href="ratings.html">Ratings</a><a href="openers.html">Openers</a><a href="matchups.html">Matchups</a><a href="schedule.html">Schedule</a><a href="futures.html">Futures</a><a href="conferences.html">Conferences</a><a href="playoff.html">Playoff</a><a href="simulations.html">Simulations</a><a href="betting.html">Betting</a><a href="v1.html">V1 Reference</a></div></div><div class="v1TeamLink"><a id="v1TeamReport" href="v1.html">Open complete V1 team report</a></div><section id="app"><div class="empty">Loading team workspace…</div></section></main><script>
let GC=new Map,FILTER='all';const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),has=x=>x!==null&&x!==undefined&&x!==''&&Number.isFinite(Number(x)),n=(x,d=1)=>has(x)?Number(x).toFixed(d):'—',pct=x=>has(x)?`${(100*Number(x)).toFixed(1)}%`:'—',ln=x=>has(x)?(Number(x)>0?'+':'')+Number(x).toFixed(1):'—',od=x=>has(x)?(Number(x)>0?'+':'')+Number(x):'—';function tone(r){return r==null?'':r<=35?'good':r<=75?'mid':'bad'}function edgeTone(v){return !Number.isFinite(v)?'':v>=3?'good':v>=1?'mid':v<=-3?'bad':''}function slug(x){return String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function teamLink(t,s){return`<a class="opp" href="team.html?team=${encodeURIComponent(s||slug(t))}"><img src="logos/${e(s||slug(t))}.png" onerror="this.style.display='none'">${e(t)}</a>`}function value(x,suffix=''){return has(x)?`${n(x)}${suffix}`:'<span class="dash">—</span>'}function rankValue(x){return x==null?'<span class="dash">—</span>':`<span class="${tone(x)}">#${x}</span>`}
function teamGame(g,team){const home=g.game.home_team===team,opp=home?g.game.away_team:g.game.home_team,tm=home?g.teams.home:g.teams.away,ot=home?g.teams.away:g.teams.home,model=g.model.home_spread,rawMarket=g.market.spread.home_line,market=has(rawMarket)&&(Number(rawMarket)!==0||g.market.spread.book)?Number(rawMarket):null,rawTotal=g.market.total.line,marketTotal=has(rawTotal)&&(Number(rawTotal)!==0||g.market.total.book)?Number(rawTotal):null,teamModel=model==null?null:(home?model:-model),teamMarket=market==null?null:(home?market:-market),wp=g.model.home_win_probability==null?null:(home?g.model.home_win_probability:1-g.model.home_win_probability),offEdge=tm.offense_rank!=null&&ot.defense_rank!=null?ot.defense_rank-tm.offense_rank:null,defEdge=tm.defense_rank!=null&&ot.offense_rank!=null?ot.offense_rank-tm.defense_rank:null,betEdge=teamModel!=null&&teamMarket!=null?teamMarket-teamModel:null,gc=GC.get(`${g.game.game_id}|${team}`),score=g.game.completed&&g.game.away_score!=null&&g.game.home_score!=null?`${g.game.away_score}-${g.game.home_score}`:'—';return{g,home,opp,tm,ot,teamModel,teamMarket,marketTotal,wp,offEdge,defEdge,betEdge,gc,score}}
function resultText(x){if(!x.g.game.completed||x.g.game.away_score==null)return'—';const teamScore=x.home?x.g.game.home_score:x.g.game.away_score,oppScore=x.home?x.g.game.away_score:x.g.game.home_score;return`${teamScore>oppScore?'W':teamScore<oppScore?'L':'T'} ${x.score}`}
function detail(x,team){const ff=x.home?x.g.matchup.home_offense_vs_away_defense:x.g.matchup.away_offense_vs_home_defense,coach=x.g.matchup.coaches.find(c=>c.team===team),weather=x.g.weather||{},angles=(x.g.angles||[]).slice(0,4);return`<tr class="detail" data-detail="${e(x.g.game.game_id)}" hidden><td colspan="14"><div class="detailGrid"><div class="detailBox"><h3>Matchup edges</h3><ul>${(ff||[]).slice(0,5).map(v=>`<li>${e(v.metric||v.factor)}: O ${rankValue(v.offense_rank)} vs D ${rankValue(v.defense_rank)}</li>`).join('')||'<li class="muted">No five-factor data</li>'}</ul></div><div class="detailBox"><h3>Coach</h3>${coach?`<b>${e(coach.coach)}</b><ul>${coach.periods.filter(Boolean).map(p=>`<li>${p.period==='full_game'?'Full Game':p.period==='first_half'?'1H':'2H'}: ${e(p.ats_record||'—')} ATS · ${ln(p.ats_margin)}</li>`).join('')}</ul>`:'<span class="muted">No matched coach data</span>'}</div><div class="detailBox"><h3>Context</h3><ul>${angles.map(a=>`<li>${e(a.headline||a.signal_type)}${a.direction?` · ${e(a.direction)}`:''}</li>`).join('')||'<li class="muted">No structured angles</li>'}</ul></div><div class="detailBox"><h3>Game status</h3><div>CFBD: ${e(x.g.game.status||'scheduled')}</div><div>PBP: ${x.gc?'Processed':'Pending'}</div><div>Weather: ${e(weather.status||'Unavailable')}</div><div style="margin-top:7px"><a href="matchups.html?game_id=${e(x.g.game.game_id)}">Open full matchup →</a></div></div></div></td></tr>`}
function row(x,team){return`<tr class="gameRow" data-game="${e(x.g.game.game_id)}"><td>W${x.g.game.week}</td><td>${String(x.g.game.date||'').slice(5,10)}</td><td>${x.home?'vs':'at'} ${teamLink(x.opp,x.ot.logo_slug)}</td><td>${rankValue(x.ot.overall_rank)}</td><td class="${edgeTone(x.offEdge)}">${ln(x.offEdge)}</td><td class="${edgeTone(x.defEdge)}">${ln(x.defEdge)}</td><td>${pct(x.wp)}</td><td>${ln(x.teamModel)}</td><td>${ln(x.teamMarket)}</td><td class="${edgeTone(x.betEdge)}">${ln(x.betEdge)}</td><td>${value(x.g.model.total)}</td><td>${value(x.marketTotal)}</td><td>${x.gc?.watchability_score!=null?n(x.gc.watchability_score):'—'}</td><td>${resultText(x)}</td></tr>${detail(x,team)}`}
function sourceMetric(label,obj){return`<div class="metric"><span>${e(label)}</span><b>${value(obj?.rating)}</b><small class="${tone(obj?.rank)}">${obj?.rank!=null?'#'+obj.rank:'—'}</small></div>`}
function winBars(dist){if(!Array.isArray(dist)||!dist.length)return'<div class="muted">Current distribution is not available.</div>';const max=Math.max(...dist.map(x=>Number(x.probability??x.pct??x.value??0)),.01);return`<div class="bars">${dist.map(x=>{const p=Number(x.probability??x.pct??x.value??0),wins=x.wins??x.win_total??x.value_label??'—';return`<div class="bar"><b>${e(wins)}</b><div class="track"><div class="fill" style="width:${Math.max(0,100*p/max)}%"></div></div><span>${(100*p).toFixed(1)}%</span></div>`}).join('')}</div>`}
async function init(){const [m,f,c,gc,r,pre]=await Promise.all([fetch('data/site/matchups_view.json').then(x=>x.json()),fetch('data/site/futures_view.json').then(x=>x.json()),fetch('data/site/conference_workspace.json').then(x=>x.json()),fetch('data/site/game_control_team_games_2026.json').then(x=>x.json()).catch(()=>({rows:[]})),fetch('data/site/ratings_view.json').then(x=>x.json()),fetch('data/snapshots/preseason/preseason_db.json').then(x=>x.json()).catch(()=>({teams:[]}))]);GC=new Map((gc.rows||[]).map(x=>[x.game_id+'|'+x.team,x]));const q=decodeURIComponent(new URLSearchParams(location.search).get('team')||'ohio-state').toLowerCase(),games=m.games.filter(g=>[g.teams.away,g.teams.home].some(t=>t.team.toLowerCase()===q||t.logo_slug===q||slug(t.team)===q));if(!games.length)throw Error('Team not found');const meta=[games[0].teams.away,games[0].teams.home].find(t=>t.team.toLowerCase()===q||t.logo_slug===q||slug(t.team)===q),team=meta.team,fu=f.rows.find(x=>x.team===team)||{},confObj=c.conferences.find(x=>x.conference===meta.conference)||{},cw=(confObj.teams||[]).find(x=>x.team===team)||{},rt=r.teams.find(x=>x.team===team)||{},pt=(pre.teams||[]).find(x=>x.team===team)||{},rp=meta.returning_production||{},sorted=games.sort((a,b)=>String(a.game.date).localeCompare(String(b.game.date)));document.title=`${team} — NCAAF`;app.innerHTML=`<section class="hero"><img src="logos/${e(meta.logo_slug)}.png"><div><h1>${e(team)}</h1><p>${e(meta.conference||'')} · V2 team command center</p><div class="stats"><div class="stat"><span>Overall rank</span><b class="${tone(meta.overall_rank)}">#${meta.overall_rank??'—'}</b></div><div class="stat"><span>2026 record</span><b>${meta.record?`${meta.record.wins}-${meta.record.losses}`:'0-0'}</b></div><div class="stat"><span>Projected record</span><b>${n(cw.projected_wins)}-${n(cw.projected_losses)}</b></div><div class="stat"><span>Conference finish</span><b>#${cw.projected_finish??'—'}</b></div><div class="stat"><span>Conference title</span><b>${pct(cw.title_pct??fu.title_model_prob)}</b></div></div></div></section><div class="dashboard grid"><div><section class="card"><h2>Preseason vs Current</h2><div class="comparison"><div class="metric"><strong>Metric</strong><strong>Preseason</strong><strong>Current</strong></div><div class="metric"><span>Power rating</span><b>${value(rt.preseason_rating)}</b><b>${value(rt.rating)}</b></div><div class="metric"><span>National rank</span><b>${rt.preseason_rank!=null?'#'+rt.preseason_rank:'—'}</b><b>${meta.overall_rank!=null?'#'+meta.overall_rank:'—'}</b></div><div class="metric"><span>Projected wins</span><b>${value(pt.avg_total_wins??pt.projected_wins)}</b><b>${value(cw.projected_wins??fu.projected_wins)}</b></div><div class="metric"><span>Projected conf wins</span><b>${value(pt.avg_conference_wins)}</b><b>${value(cw.projected_conf_wins)}</b></div><div class="metric"><span>Conference title</span><b>${pt.conference_title_pct!=null?pct(Number(pt.conference_title_pct)>1?Number(pt.conference_title_pct)/100:pt.conference_title_pct):'—'}</b><b>${pct(cw.title_pct??fu.title_model_prob)}</b></div></div></section><section class="card"><h2>Market vs Projection</h2><div class="marketRows"><div class="metric"><span>Win total</span><b>${value(fu.projected_wins)} vs ${value(fu.market_win_total)}</b><small class="${edgeTone(Math.abs(Number(fu.win_edge)))}">${fu.win_edge==null?'—':`${e(fu.win_direction)} ${n(Math.abs(fu.win_edge))} · ${od(fu.win_price)}`}</small></div><div class="metric"><span>Conference title</span><b>${pct(fu.title_model_prob)} vs ${pct(fu.title_market_prob)}</b><small class="${edgeTone(100*Number(fu.title_edge))}">${fu.title_edge==null?'—':`${n(100*fu.title_edge)} pts · ${od(fu.title_price)}`}</small></div><div class="metric"><span>Make playoff</span><b>${pct(fu.playoff_model_prob)} vs ${pct(fu.playoff_market_prob)}</b><small>${fu.playoff_edge==null?'No market':'Edge '+n(100*fu.playoff_edge)+' pts'}</small></div><div class="metric"><span>National title</span><b>${pct(fu.national_title_model_prob)} vs ${pct(fu.national_title_market_prob)}</b><small>${fu.national_title_edge==null?'—':`${n(100*fu.national_title_edge)} pts · ${od(fu.national_title_price)}`}</small></div></div></section></div><div><section class="card"><h2>Ratings</h2><div class="mini"><div class="metric"><span>Composite</span><b>${value(rt.rating)}</b><small class="${tone(meta.overall_rank)}">#${meta.overall_rank??'—'}</small></div>${sourceMetric('SP+',rt.sources?.spplus)}${sourceMetric('FPI',rt.sources?.fpi)}${sourceMetric('TeamRankings',rt.sources?.teamrankings)}${sourceMetric('Brad Powers',rt.sources?.bradpowers)}<div class="metric"><span>Variance</span><b>${value(rt.variance)}</b></div></div></section><section class="card"><h2>Win Distribution</h2><p class="sectionNote">Frozen preseason simulation; current in-season distribution is not exposed by V2 JSON.</p>${winBars(pt.win_distribution)}</section></div><section class="card schedule"><h2>KFord-inspired Schedule Command Center</h2><p class="sectionNote">Offense edge = opponent defense rank minus ${e(team)} offense rank. Defense edge = opponent offense rank minus ${e(team)} defense rank. Positive values favor ${e(team)}.</p><div class="filters" id="filters"><button class="active" data-filter="all">All Games</button><button data-filter="fbs">FBS vs FBS</button><button data-filter="conference">Conference Only</button></div><div class="tableWrap"><table><thead><tr><th>Wk</th><th>Date</th><th>Opponent</th><th>Opp rank</th><th>Off edge</th><th>Def edge</th><th>Win %</th><th>Model spread</th><th>Market spread</th><th>Betting edge</th><th>Proj total</th><th>Market total</th><th>WS</th><th>Result</th></tr></thead><tbody id="scheduleRows"></tbody></table></div></section><section class="card schedule"><h2>Conference Outlook</h2><div class="outlook"><div class="metric"><span>Projected finish</span><b>#${cw.projected_finish??'—'}</b></div><div class="metric"><span>Projected conference record</span><b>${n(cw.projected_conf_wins)}-${n(cw.projected_conf_losses)}</b></div><div class="metric"><span>Make title game</span><b>${pct(cw.make_title_game_pct)}</b></div><div class="metric"><span>Win conference</span><b>${pct(cw.title_pct)}</b></div><div class="metric"><span>Conference SOS</span><b>${value(cw.conf_sos)} · #${cw.conf_sos_rank??'—'}</b></div><div class="metric"><span>Remaining conf SOS</span><b>${value(cw.remaining_sos)} · #${cw.remaining_sos_rank??'—'}</b></div><div class="metric"><span>Conference strength</span><b>${value(confObj.average_team_rating)} · #${confObj.conference_rank??'—'}</b></div><div class="metric"><span>Open wagers</span><b>${(cw.open_wagers||[]).length}</b></div></div></section></div>`;function drawSchedule(){const list=sorted.map(g=>teamGame(g,team)).filter(x=>FILTER==='all'||FILTER==='fbs'&&(x.tm.overall_rank!=null&&x.ot.overall_rank!=null)||FILTER==='conference'&&x.tm.conference===x.ot.conference);scheduleRows.innerHTML=list.map(x=>row(x,team)).join('')||'<tr><td colspan="14" class="empty">No games match this filter.</td></tr>';scheduleRows.querySelectorAll('.gameRow').forEach(tr=>tr.onclick=ev=>{if(ev.target.closest('a'))return;const d=scheduleRows.querySelector(`[data-detail="${CSS.escape(tr.dataset.game)}"]`);d.hidden=!d.hidden;tr.classList.toggle('open',!d.hidden)})}filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{FILTER=b.dataset.filter;filters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));drawSchedule()});drawSchedule()}
init().catch(err=>app.innerHTML=`<div class="empty">Unable to load team: ${e(err.message)}</div>`);
</script><script src="team_coach_card.js"></script><script>const v1q=new URLSearchParams(location.search).get("team");document.getElementById("v1TeamReport").href="v1.html#team/"+encodeURIComponent(v1q||"")</script></body></html>
